[project]
name = "multi-agent-auditor"
version = "0.1.0"
description = "AI multi-agent smart contract auditor with Foundry PoC-exploit confirmation"
requires-python = ">=3.11"
dependencies = [
    "eth-utils>=6.0.0",
    "httpx>=0.28.1",
    "langchain>=0.3,<0.4",
    "langchain-openai>=0.3,<0.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "slither-analyzer>=0.11.6",
    "streamlit>=1.62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auditor"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
